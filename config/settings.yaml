# Global Fund & Trading Settings
fund:
  name: "Ashva Quant Fund"
  base_currency: "INR"
  initial_capital: 500000.0  # ₹5,00,000 INR
  mode: "paper"               # "paper" or "live"
  timezone: "Asia/Kolkata"

market:
  exchange: "NSE"
  trading_hours:
    market_open: "09:15:00"
    market_close: "15:30:00"
    intraday_square_off: "15:15:00"
    opening_range_end: "09:45:00"

universe:
  name: "NIFTY 77"
  benchmark: "^NSEI"          # NIFTY Index Benchmark
  token_file: "config/nifty77_tokens.json"
  primary_tickers:
    - "INFY"
    - "TCS"
    - "ICICIBANK"
    - "HDFCBANK"
    - "SBIN"
    - "RELIANCE"
    - "TATAMOTORS"
    - "BHARTIARTL"

active_strategy:
  id: "ALPHA_01_TREND_SURFER"
  name: "TrendSurfer_Pro"
  timeframe: "15m"
  risk_per_trade_pct: 0.005  # 0.50% account risk per trade
  max_capital_per_trade_pct: 0.25  # 25% max capital cap

data:
  storage_backend: "duckdb"
  db_path: "data_lake/ashva_market_data.duckdb"
  parquet_dir: "data_lake/parquet/"
  default_timeframe: "15m"     # 1m, 5m, 15m, 1h, 1d
